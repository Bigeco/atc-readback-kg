<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ATC-KG Strip Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">ATC·KG</span>
      <span class="brand-sub" id="run-label">loading…</span>
    </div>
    <div class="kpis" id="kpis"></div>
    <label class="search">
      <span>CALLSIGN</span>
      <input id="search" type="search" placeholder="DAL2642" autocomplete="off">
    </label>
  </header>

  <section class="scrubber">
    <button id="play" class="play" title="재생">▶</button>
    <div class="scrub-track">
      <canvas id="histogram" height="56"></canvas>
      <input id="time" type="range" min="0" max="1" step="1" value="0">
    </div>
    <div class="clock"><span id="clock">--:--:--</span><small>UTC</small></div>
  </section>

  <main class="board">
    <aside class="bay">
      <div class="bay-head">
        <h2>Strip bay</h2>
        <small id="bay-note">±10 min</small>
      </div>
      <div id="strips" class="strips"></div>
    </aside>

    <section class="work">
      <nav class="tabs" id="tabs">
        <button data-tab="airfield" class="active">Airfield @ t</button>
        <button data-tab="flight">Flight timeline</button>
        <button data-tab="graph">Event graph</button>
        <button data-tab="eval">Quality</button>
      </nav>
      <div class="tab-body">
        <div id="tab-airfield" class="tab active"></div>
        <div id="tab-flight" class="tab"><p class="hint">왼쪽 strip이나 경보를 눌러 항공편을 선택하세요.</p></div>
        <div id="tab-graph" class="tab"><div id="cy"></div><div class="legend" id="legend"></div></div>
        <div id="tab-eval" class="tab"></div>
      </div>
    </section>

    <aside class="side">
      <div id="evidence" class="evidence hidden"></div>
      <div class="alerts-head">
        <h2>Alerts</h2>
        <label class="near"><input type="checkbox" id="near-only"> 시점 ±15분</label>
      </div>
      <div class="alert-filters" id="alert-filters"></div>
      <div id="alerts" class="alerts"></div>
    </aside>
  </main>

  <audio id="player" preload="none"></audio>
  <script src="app.js"></script>
</body>
</html>
