<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ATC Readback KG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/layout-base@2.0.1/layout-base.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cose-base@2.2.0/cose-base.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape-fcose@2.2.0/cytoscape-fcose.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-logo" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M10 2 18 10 10 18 2 10z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="10" cy="10" r="2.2" fill="currentColor"/></svg></span>
      <div class="brand-text">
        <span class="brand-mark">ATC Readback KG</span>
        <span class="brand-sub"><span id="run-label">loading…</span><span class="badge" id="mode-badge" hidden title="LiveATC terms do not allow redistributing audio or transcripts; only extracted instructions and readback results are published">Public release · no transcripts or audio</span></span>
      </div>
    </div>
    <div class="kpis" id="kpis"></div>
    <a class="btn dl" id="download" href="atc_readback_kg_public.zip" download hidden><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8m0 0-3-3m3 3 3-3M3 13h10" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>Download KG</a>
    <label class="search">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m10.5 10.5 3.5 3.5" stroke="currentColor" stroke-width="1.5"/></svg>
      <input id="search" type="search" placeholder="Callsign (DAL2642)" autocomplete="off">
    </label>
  </header>

  <section class="scrubber">
    <button id="play" class="play" title="Advance the timeline automatically (no sound)"><svg class="i-play" viewBox="0 0 16 16"><path d="M5 3.5v9l7-4.5z" fill="currentColor"/></svg><svg class="i-pause" viewBox="0 0 16 16"><path d="M4.5 3.5h2.5v9H4.5zM9 3.5h2.5v9H9z" fill="currentColor"/></svg><span>Auto-advance</span></button>
    <div class="scrub-track">
      <canvas id="histogram" height="56"></canvas>
      <input id="time" type="range" min="0" max="1" step="1" value="0">
    </div>
    <label class="clock" title="Type a UTC time (HH:MM or HH:MM:SS) and press Enter"><input id="clock" value="--:--:--" maxlength="8" spellcheck="false" autocomplete="off" inputmode="numeric" aria-label="Time (UTC)"><small>UTC</small></label>
  </section>

  <main class="board">
    <aside class="bay">
      <div class="bay-head">
        <h2>Flights</h2>
        <small id="bay-note">±10 min</small>
      </div>
      <div id="strips" class="strips"></div>
    </aside>

    <section class="work">
      <nav class="tabs" id="tabs">
        <button data-tab="airfield" class="active">Airfield at t</button>
        <button data-tab="kg">KG explorer</button>
        <button data-tab="flight">Flight timeline</button>
        <button data-tab="eval">Quality</button>
      </nav>
      <div class="tab-body">
        <div id="tab-airfield" class="tab active"></div>
        <div id="tab-flight" class="tab"><p class="hint">Select a flight from the list on the left or from an alert.</p></div>
        <div id="tab-kg" class="tab kg-tab">
          <div class="kg-bar">
            <div class="seg" id="kg-mode">
              <button data-mode="entity" class="on" title="Entity linking (M3): callsign mentions, flights, airlines, airport places">Entity linking</button>
              <button data-mode="event" title="Temporal layer (M4): transmissions, instructions, readbacks">Event layer</button>
            </div>
            <span class="kg-window" id="kg-window"></span>
            <label class="kg-find"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m10.5 10.5 3.5 3.5" stroke="currentColor" stroke-width="1.5"/></svg><input id="kg-find" type="search" placeholder="Find node (DAL1489, 8R, E)"></label>
            <button class="btn" id="kg-relayout" title="Run the layout again">Re-layout</button>
            <button class="btn" id="kg-fit">Fit</button>
          </div>
          <div class="kg-stage"><div id="kgcy"></div><div class="kg-edgekey" id="kg-edgekey"></div><div class="kg-detail hidden" id="kg-detail"></div><div class="kg-tip" id="kg-tip"></div></div>
          <div class="kg-legend" id="kg-legend"></div>
        </div>
        <div id="tab-eval" class="tab"></div>
      </div>
    </section>

    <aside class="side">
      <div id="evidence" class="evidence hidden"></div>
      <div class="alerts-head">
        <h2>Alerts</h2>
        <label class="near"><input type="checkbox" id="near-only"> ±15 min of t</label>
      </div>
      <div class="alert-filters" id="alert-filters"></div>
      <div id="alerts" class="alerts"></div>
    </aside>
  </main>

  <audio id="player" preload="none"></audio>
  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
